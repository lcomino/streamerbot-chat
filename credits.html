<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créditos da Live - Zoidepomba Live Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/menu.css">
    <link rel="stylesheet" href="assets/css/credits.css">
</head>
<body>
    <!-- O menu será inserido aqui pelo JavaScript -->
    
    <div class="credits-container">
        <div class="credits-content">
            <section class="credits-section top-chatters">
                <h2><i class="fas fa-crown"></i> Top Participantes</h2>
                <div class="credits-list" id="topChatters">
                    <!-- Preenchido via JavaScript -->
                </div>
            </section>

            <section class="credits-section top-commands">
                <h2><i class="fas fa-terminal"></i> Comandos Mais Usados</h2>
                <div class="credits-list" id="topCommands">
                    <!-- Preenchido via JavaScript -->
                </div>
            </section>

            <section class="credits-section platform-stats">
                <h2><i class="fas fa-chart-pie"></i> Estatísticas por Plataforma</h2>
                <div class="platform-boxes" id="platformStats">
                    <!-- Preenchido via JavaScript -->
                </div>
            </section>

            <section class="credits-section session-stats">
                <h2><i class="fas fa-info-circle"></i> Informações da Live</h2>
                <div class="stats-grid" id="sessionStats">
                    <!-- Preenchido via JavaScript -->
                </div>
            </section>

            <div class="credits-actions">
                <button id="startCredits" class="action-button">
                    <i class="fas fa-play"></i> Iniciar Créditos
                </button>
                <button id="resetStats" class="action-button danger">
                    <i class="fas fa-trash"></i> Resetar Estatísticas
                </button>
            </div>
        </div>
    </div>

    <script src="assets/js/menu.js"></script>
    <script src="assets/js/credits.js"></script>
</body>
</html>
